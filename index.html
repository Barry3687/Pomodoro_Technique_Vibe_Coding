<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>沉浸式咖啡廳番茄鐘 | Lo-Fi Cafe Pomodoro</title>
  <style>
    :root {
      /* 窗外暮色至初夜漸層 */
      --sky-top: #182033;
      --sky-mid: #43344D;
      --sky-horizon: #B86B43;

      /* 城市建築剪影與燈火 */
      --city-far: #1C2338;
      --city-near: #121624;
      --window-light: #FAD074;

      /* 咖啡廳吧檯木質調 */
      --wood-dark: #2E1C14;
      --wood-main: #4E3120;
      --wood-highlight: #7D5338;

      /* 桌面物件與復古計時器 */
      --timer-shell: #EADFC9;
      --timer-shell-shadow: #CBBBA0;
      --timer-lcd: #1F2E28;
      --digit-work: #FFB347;
      --digit-work-glow: #FF9800;
      --digit-rest: #66BB6A;
      --digit-rest-glow: #43A047;
      --log-paper: #F5EEDC;
      --stamp-red: #D32F2F;

      /* 氛圍光學特效 */
      --lamp-cone: rgba(255, 204, 128, 0.18);
      --steam-color: rgba(255, 255, 255, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background-color: var(--sky-top);
      color: #F5EEDC;
    }

    /* =========================================
       Layer 0 & 1 & 2: 窗外天際線、城市剪影與落地窗
       ========================================= */
    .viewport-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .layer-sky-window {
      position: absolute;
      inset: 0;
      z-index: 0;
      background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 52%, var(--sky-horizon) 76%, var(--wood-dark) 77%);
      pointer-events: none;
    }

    .city-scene-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 76%;
      z-index: 1;
      object-fit: cover;
      pointer-events: none;
    }

    /* 窗戶與星光呼吸閃爍動畫 */
    .star-dot {
      animation: starTwinkle 4s ease-in-out infinite alternate;
    }
    .star-dot.delay-1 { animation-delay: 1.2s; }
    .star-dot.delay-2 { animation-delay: 2.5s; }
    .star-dot.delay-3 { animation-delay: 3.7s; }

    .city-win {
      fill: var(--window-light);
      animation: winBreathe 6s ease-in-out infinite alternate;
    }
    .city-win.slow { animation-duration: 9s; animation-delay: 1.5s; }
    .city-win.fast { animation-duration: 4.5s; animation-delay: 0.7s; }
    .city-win.dim { opacity: 0.35; animation: none; }

    @keyframes starTwinkle {
      0% { opacity: 0.25; transform: scale(0.9); }
      100% { opacity: 0.95; transform: scale(1.15); }
    }

    @keyframes winBreathe {
      0%, 20% { opacity: 0.85; }
      50% { opacity: 0.25; }
      80%, 100% { opacity: 0.95; }
    }

    /* Layer 2: 落地大玻璃窗框與反光 */
    .window-frame-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 74%;
      z-index: 2;
      pointer-events: none;
      border-bottom: 14px solid #1B120C;
      box-shadow: inset 0 0 80px rgba(10, 12, 22, 0.75);
      overflow: hidden;
    }

    .window-mullion-v {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 10px;
      background: linear-gradient(90deg, #120C08, #2A1B12, #120C08);
      box-shadow: 2px 0 12px rgba(0, 0, 0, 0.5);
    }
    .window-mullion-v.left { left: 26%; }
    .window-mullion-v.right { left: 74%; }

    .window-mullion-h {
      position: absolute;
      left: 0;
      right: 0;
      top: 18%;
      height: 8px;
      background: linear-gradient(180deg, #120C08, #2A1B12);
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.45);
    }

    .window-reflection {
      position: absolute;
      top: -20%;
      left: 12%;
      width: 18%;
      height: 150%;
      background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,235,205,0.04) 50%, rgba(255,255,255,0) 100%);
      transform: rotate(22deg) translate3d(0, 0, 0);
    }

    /* =========================================
       Layer 3 & 4: 咖啡廳吧檯桌面、檯燈光錐與桌面景物
       ========================================= */
    .desk-surface-layer {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 28%;
      z-index: 3;
      background: linear-gradient(180deg, var(--wood-highlight) 0%, var(--wood-main) 5%, var(--wood-dark) 100%);
      border-top: 4px solid #96684A;
      box-shadow: 0 -10px 35px rgba(0, 0, 0, 0.65), inset 0 12px 28px rgba(255, 198, 138, 0.08);
    }

    /* 木紋細節 */
    .desk-surface-layer::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 18px,
        rgba(20, 10, 4, 0.16) 19px,
        transparent 20px
      );
      pointer-events: none;
    }

    /* 檯燈錐形暖光投影 */
    .lamp-light-cone {
      position: absolute;
      right: 2%;
      bottom: 8%;
      width: 55vw;
      height: 82vh;
      z-index: 3;
      background: radial-gradient(ellipse at 78% 12%, rgba(255, 210, 135, 0.26) 0%, var(--lamp-cone) 38%, rgba(255, 204, 128, 0) 72%);
      clip-path: polygon(68% 0%, 92% 0%, 100% 100%, 5% 100%);
      pointer-events: none;
      mix-blend-mode: screen;
      animation: lampFlicker 8s ease-in-out infinite alternate;
    }

    @keyframes lampFlicker {
      0%, 100% { opacity: 0.95; }
      50% { opacity: 0.82; }
    }

    /* Layer 4: 桌面實體景物層 */
    .desk-props-layer {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
    }

    /* 專注人物剪影（背影/微側影） */
    .character-wrapper {
      position: absolute;
      left: 50%;
      bottom: 24%;
      transform: translate3d(-50%, 0, 0);
      width: 340px;
      height: 310px;
      opacity: 0.92;
      filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.55));
    }

    .char-breathe-group {
      transform-origin: center bottom;
      animation: charBreathe 4.2s ease-in-out infinite;
    }

    .viewport-container.is-running .char-breathe-group {
      animation-duration: 3.2s;
    }

    @keyframes charBreathe {
      0%, 100% { transform: translate3d(0, 0, 0) scaleY(1); }
      50% { transform: translate3d(0, -3px, 0) scaleY(1.012); }
    }

    /* 小多肉盆栽 */
    .prop-succulent {
      position: absolute;
      left: 26%;
      bottom: 21%;
      width: 95px;
      height: 115px;
      filter: drop-shadow(0 8px 10px rgba(0, 0, 0, 0.5));
    }

    /* 熱咖啡與純 CSS 冒煙動態 */
    .prop-coffee-group {
      position: absolute;
      right: 23%;
      bottom: 18%;
      width: 120px;
      height: 140px;
      filter: drop-shadow(0 10px 12px rgba(0, 0, 0, 0.55));
    }

    .steam-container {
      position: absolute;
      top: 4px;
      left: 34px;
      width: 50px;
      height: 55px;
      pointer-events: none;
    }

    .steam-wisp {
      position: absolute;
      bottom: 0;
      width: 10px;
      height: 38px;
      border-radius: 50%;
      border-left: 3px solid var(--steam-color);
      filter: blur(1.5px);
      opacity: 0;
      animation: steamRise 3.8s ease-in-out infinite;
    }

    .steam-wisp.w1 { left: 6px; animation-delay: 0s; }
    .steam-wisp.w2 { left: 20px; height: 44px; animation-delay: 1.2s; }
    .steam-wisp.w3 { left: 32px; height: 34px; animation-delay: 2.4s; }

    @keyframes steamRise {
      0% {
        transform: translate3d(0, 8px, 0) scaleX(0.8) rotate(-4deg);
        opacity: 0;
      }
      35% {
        opacity: 0.65;
      }
      70% {
        transform: translate3d(-5px, -18px, 0) scaleX(1.25) rotate(8deg);
        opacity: 0.35;
      }
      100% {
        transform: translate3d(4px, -36px, 0) scaleX(1.5) rotate(-6deg);
        opacity: 0;
      }
    }

    /* 復古檯燈實體 */
    .prop-desk-lamp {
      position: absolute;
      right: 3%;
      bottom: 17%;
      width: 190px;
      height: 340px;
      filter: drop-shadow(-6px 12px 16px rgba(0, 0, 0, 0.6));
    }

    /* =========================================
       Layer 5: 核心互動儀表板
       ========================================= */
    .ui-dashboard-layer {
      position: relative;
      z-index: 5;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* 右上方：真實世界時鐘 */
    .real-world-clock {
      position: absolute;
      top: 24px;
      right: 32px;
      pointer-events: auto;
      background: rgba(24, 32, 51, 0.78);
      border: 1px solid rgba(250, 208, 116, 0.35);
      border-radius: 12px;
      padding: 10px 18px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 0.95rem;
      letter-spacing: 0.06em;
      color: #FAD074;
    }

    .clock-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #FFB347;
      box-shadow: 0 0 8px #FFB347;
      animation: clockPulse 2s infinite;
    }

    @keyframes clockPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    /* 正中央偏下：桌上復古數位計時器 */
    .retro-timer-unit {
      position: absolute;
      left: 50%;
      bottom: 5.5%;
      transform: translate3d(-50%, 0, 0);
      pointer-events: auto;
      width: 370px;
      background: linear-gradient(180deg, #F4EBDC 0%, var(--timer-shell) 65%, var(--timer-shell-shadow) 100%);
      border-radius: 26px;
      padding: 20px 22px 18px;
      border: 3px solid #B8A589;
      box-shadow:
        0 20px 38px rgba(0, 0, 0, 0.7),
        0 4px 0 #8F7C61,
        inset 0 2px 3px rgba(255, 255, 255, 0.8);
      color: #2E1C14;
    }

    /* 計時器頂部裝飾金屬銘牌與螺絲 */
    .timer-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding: 0 4px;
    }

    .brand-plate {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: #5C4633;
      background: #DFD1B8;
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid #C2B092;
    }

    .mode-badge-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-led-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 3px 9px;
      border-radius: 99px;
      background: #2C221A;
      color: #CFC3B2;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .status-led-pill:hover {
      transform: translateY(-1px);
    }

    .led-bulb {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #555;
      transition: all 0.3s ease;
    }

    .retro-timer-unit.mode-work .led-bulb.work-led {
      background: var(--digit-work);
      box-shadow: 0 0 8px var(--digit-work);
    }

    .retro-timer-unit.mode-break .led-bulb.rest-led {
      background: var(--digit-rest);
      box-shadow: 0 0 8px var(--digit-rest);
    }

    /* 液晶背光暗綠面板 */
    .lcd-screen {
      position: relative;
      background: radial-gradient(circle at 50% 40%, #263831 0%, var(--timer-lcd) 75%, #16221D 100%);
      border-radius: 14px;
      border: 4px solid #A8967B;
      box-shadow:
        inset 0 6px 14px rgba(0, 0, 0, 0.75),
        0 2px 0 rgba(255, 255, 255, 0.6);
      padding: 14px 18px 12px;
      text-align: center;
      margin-bottom: 16px;
      overflow: hidden;
    }

    /* 液晶面板細微網格紋理 */
    .lcd-screen::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 0);
      background-size: 4px 4px;
      pointer-events: none;
    }

    .lcd-sub-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: "JetBrains Mono", Consolas, monospace;
      font-size: 0.72rem;
      color: rgba(234, 223, 201, 0.55);
      margin-bottom: 2px;
      letter-spacing: 0.08em;
    }

    .lcd-digits {
      font-family: "JetBrains Mono", "Courier New", Consolas, monospace;
      font-size: 3.85rem;
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: 0.06em;
      color: var(--digit-work);
      text-shadow: 0 0 14px rgba(255, 152, 0, 0.65), 0 0 28px rgba(255, 179, 71, 0.25);
      transition: color 0.3s ease, text-shadow 0.3s ease;
    }

    .retro-timer-unit.mode-break .lcd-digits {
      color: var(--digit-rest);
      text-shadow: 0 0 14px rgba(67, 160, 71, 0.65), 0 0 28px rgba(102, 187, 106, 0.25);
    }

    /* 暫停時呼吸閃爍（1s 週期） */
    .retro-timer-unit.is-paused .lcd-digits {
      animation: pausedBlink 1s ease-in-out infinite;
    }

    @keyframes pausedBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.28; }
    }

    /* 實體金屬感按鈕列 */
    .timer-controls {
      display: grid;
      grid-template-columns: 1.4fr 1fr 48px;
      gap: 10px;
      align-items: center;
    }

    .retro-btn {
      appearance: none;
      border: 2px solid #6E5842;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.92rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.2s ease;
      box-shadow: 0 4px 0 #5C4734, 0 6px 10px rgba(0, 0, 0, 0.25);
    }

    .retro-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #5C4734, 0 2px 4px rgba(0, 0, 0, 0.2);
    }

    .retro-btn.btn-primary {
      background: linear-gradient(180deg, #E07A48 0%, #C25929 100%);
      color: #FFF8EE;
      border-color: #7D3616;
      box-shadow: 0 4px 0 #6B2D10, 0 6px 10px rgba(0, 0, 0, 0.28);
    }

    .retro-btn.btn-primary.running-state {
      background: linear-gradient(180deg, #D99B38 0%, #B87B1E 100%);
      border-color: #784E0E;
      box-shadow: 0 4px 0 #613E09;
    }

    .retro-btn.btn-secondary {
      background: linear-gradient(180deg, #DFD3BE 0%, #C7B69B 100%);
      color: #3D2B1F;
    }

    .retro-btn.btn-icon {
      padding: 10px 0;
      background: linear-gradient(180deg, #D7C8B0 0%, #BBA789 100%);
      color: #3D2B1F;
      font-size: 1.05rem;
    }

    /* 計時器內嵌防呆確認氣泡（重置或切換時觸發） */
    .confirm-popover {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: calc(100% + 10px);
      background: rgba(30, 20, 14, 0.96);
      border: 2px solid #FFB347;
      border-radius: 14px;
      padding: 12px 14px;
      color: #F5EEDC;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.65);
      display: none;
      flex-direction: column;
      gap: 10px;
      z-index: 12;
      animation: popSlideUp 0.2s ease-out;
    }

    .confirm-popover.show {
      display: flex;
    }

    @keyframes popSlideUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .confirm-popover-text {
      font-size: 0.85rem;
      line-height: 1.4;
      color: #FAD074;
    }

    .confirm-popover-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .pop-btn {
      padding: 5px 12px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      background: #38281E;
      color: #EADFC9;
    }

    .pop-btn.confirm-yes {
      background: #D32F2F;
      border-color: #FF6659;
      color: #FFF;
    }

    /* 左下角：手帳本（打卡專區） */
    .logbook-widget {
      position: absolute;
      left: 34px;
      bottom: 4.5%;
      pointer-events: auto;
      width: 280px;
      background: var(--log-paper);
      color: #3B281B;
      border-radius: 10px 16px 16px 10px;
      padding: 16px 18px 14px 24px;
      border: 2px solid #C8B698;
      border-left: 12px solid #593722;
      box-shadow:
        0 16px 32px rgba(0, 0, 0, 0.65),
        4px 4px 0 #D8CBB3,
        8px 8px 0 #3E2516;
      transform: rotate(-1.5deg);
      transition: transform 0.25s ease;
      /* 木質方格內頁紋理 */
      background-image:
        linear-gradient(rgba(139, 90, 43, 0.1) 1px, transparent 1px),
        linear-gradient(90deg, rgba(139, 90, 43, 0.1) 1px, transparent 1px);
      background-size: 16px 16px;
    }

    .logbook-widget:hover {
      transform: rotate(0deg) translateY(-2px);
    }

    /* 手帳本左側金屬線圈裝飾 */
    .logbook-rings {
      position: absolute;
      left: -9px;
      top: 18px;
      bottom: 18px;
      width: 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      pointer-events: none;
    }

    .ring-loop {
      width: 12px;
      height: 6px;
      border-radius: 4px;
      background: linear-gradient(90deg, #888, #DDD, #666);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
    }

    .logbook-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 2px dashed rgba(92, 62, 40, 0.35);
      padding-bottom: 6px;
      margin-bottom: 10px;
    }

    .logbook-title {
      font-size: 0.88rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      color: #4E3120;
    }

    .logbook-count-badge {
      font-family: "JetBrains Mono", Consolas, monospace;
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--stamp-red);
      background: rgba(211, 47, 47, 0.1);
      padding: 2px 8px;
      border-radius: 99px;
      border: 1px solid rgba(211, 47, 47, 0.3);
    }

    .stamp-grid {
      min-height: 68px;
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      align-items: center;
      align-content: flex-start;
      padding: 4px 0;
    }

    .empty-log-hint {
      font-size: 0.78rem;
      color: #8C735B;
      font-style: italic;
    }

    /* 番茄完成印章朱紅 */
    .tomato-stamp {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 2px solid var(--stamp-red);
      background: rgba(211, 47, 47, 0.12);
      color: var(--stamp-red);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      box-shadow: inset 0 0 0 1px rgba(211, 47, 47, 0.25);
      transform: rotate(-6deg);
    }

    .tomato-stamp:nth-child(even) {
      transform: rotate(7deg);
    }

    .tomato-stamp.stamp-new {
      animation: stampPop 0.45s cubic-bezier(0.22, 1.4, 0.36, 1) forwards;
    }

    @keyframes stampPop {
      0% { transform: scale(1.6) rotate(-12deg); opacity: 0.2; }
      60% { transform: scale(1.2) rotate(4deg); opacity: 1; }
      100% { transform: scale(1) rotate(-4deg); opacity: 1; }
    }

    .stamp-overflow-pill {
      font-size: 0.78rem;
      font-weight: 800;
      color: var(--stamp-red);
      border: 1.5px dashed var(--stamp-red);
      border-radius: 99px;
      padding: 3px 9px;
      background: rgba(211, 47, 47, 0.08);
    }

    .logbook-footer {
      margin-top: 8px;
      padding-top: 6px;
      border-top: 1px solid rgba(92, 62, 40, 0.18);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.72rem;
      color: #7A5C43;
    }

    .clear-log-btn {
      background: none;
      border: none;
      color: #9E473B;
      font-size: 0.72rem;
      font-weight: 700;
      text-decoration: underline;
      cursor: pointer;
      padding: 2px 4px;
    }

    .clear-log-btn:hover {
      color: var(--stamp-red);
    }

    /* =========================================
       Layer 6: 全螢幕完成光暈特效 & 設定彈窗面板
       ========================================= */
    .completion-glow-overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      opacity: 0;
      box-shadow: inset 0 0 130px 45px rgba(255, 183, 77, 0.75);
      background: radial-gradient(circle at center, rgba(255, 213, 128, 0.18) 0%, rgba(255, 152, 0, 0.32) 100%);
    }

    .completion-glow-overlay.active-glow {
      animation: glowPulseAnim 2.8s ease-out forwards;
    }

    @keyframes glowPulseAnim {
      0% { opacity: 0; }
      20% { opacity: 1; }
      55% { opacity: 0.75; }
      100% { opacity: 0; }
    }

    /* 毛玻璃設定抽屜彈窗 */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 15;
      background: rgba(12, 16, 28, 0.65);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-backdrop.open {
      display: flex;
      animation: fadeInModal 0.2s ease-out;
    }

    @keyframes fadeInModal {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .settings-drawer {
      width: 100%;
      max-width: 390px;
      background: linear-gradient(180deg, #2B1D16 0%, #1F140E 100%);
      border: 2px solid #8C6243;
      border-radius: 20px;
      padding: 22px 24px;
      color: #F5EEDC;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.75);
    }

    .settings-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(250, 208, 116, 0.2);
    }

    .settings-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: #FAD074;
      letter-spacing: 0.05em;
    }

    .close-modal-btn {
      background: none;
      border: none;
      color: #C7B299;
      font-size: 1.3rem;
      cursor: pointer;
      line-height: 1;
    }

    .preset-section-label {
      font-size: 0.8rem;
      color: #C7B299;
      margin-bottom: 8px;
      display: block;
    }

    .preset-btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 18px;
    }

    .preset-chip {
      padding: 10px 12px;
      border-radius: 10px;
      border: 1.5px solid #6E4E37;
      background: #36241B;
      color: #EADFC9;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
    }

    .preset-chip.active {
      border-color: #FFB347;
      background: rgba(255, 179, 71, 0.18);
      color: #FFB347;
      box-shadow: 0 0 12px rgba(255, 179, 71, 0.25);
    }

    .custom-inputs-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 18px;
    }

    .input-field-box {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-field-box label {
      font-size: 0.8rem;
      color: #D9C6B0;
    }

    .input-field-box input {
      background: #160E0A;
      border: 1.5px solid #6E4E37;
      border-radius: 8px;
      padding: 9px 12px;
      color: #FFB347;
      font-family: "JetBrains Mono", Consolas, monospace;
      font-size: 1rem;
      font-weight: 700;
      outline: none;
    }

    .input-field-box input:focus {
      border-color: #FFB347;
    }

    .running-warning-note {
      display: none;
      font-size: 0.78rem;
      color: #FFB347;
      background: rgba(255, 152, 0, 0.12);
      border: 1px solid rgba(255, 179, 71, 0.35);
      padding: 8px 10px;
      border-radius: 8px;
      margin-bottom: 14px;
      line-height: 1.4;
    }

    .running-warning-note.visible {
      display: block;
    }

    .settings-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .btn-save-settings {
      width: 100%;
      padding: 11px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(180deg, #FFB347 0%, #E68A00 100%);
      color: #261408;
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(230, 138, 0, 0.35);
    }

    /* =========================================
       手機端與窄螢幕響應式適配 (Media Queries)
       ========================================= */
    @media (max-width: 860px) {
      html, body {
        overflow-y: auto;
        height: auto;
        min-height: 100vh;
      }

      .viewport-container {
        height: auto;
        min-height: 100vh;
        overflow-x: hidden;
        overflow-y: visible;
        padding-bottom: 32px;
      }

      .desk-surface-layer {
        height: 45%;
      }

      .character-wrapper {
        bottom: 42%;
        width: 240px;
        height: 220px;
        opacity: 0.85;
      }

      .prop-succulent {
        left: 4%;
        bottom: 40%;
        transform: scale(0.82);
      }

      .prop-coffee-group {
        right: 4%;
        bottom: 38%;
        transform: scale(0.82);
      }

      .prop-desk-lamp {
        display: none;
      }

      /* 垂直流暢堆疊：時鐘 -> 計時器 -> 手帳本 */
      .ui-dashboard-layer {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        gap: 20px;
        padding: 18px 16px 28px;
        min-height: 100vh;
      }

      .real-world-clock {
        position: static;
        margin-top: 4px;
        margin-bottom: auto;
        font-size: 0.82rem;
        padding: 8px 14px;
      }

      .retro-timer-unit {
        position: static;
        transform: none;
        width: 100%;
        max-width: 350px;
        margin-top: 170px;
      }

      .logbook-widget {
        position: static;
        transform: none;
        width: 100%;
        max-width: 350px;
      }

      .logbook-widget:hover {
        transform: none;
      }
    }
  </style>
</head>

          </button>
        </div>
      </div>

      <!-- 左下角：手帳本（打卡專區） -->
      <div class="logbook-widget" aria-label="今日專注打卡手帳本">
        <div class="logbook-rings" aria-hidden="true">
          <span class="ring-loop"></span>
          <span class="ring-loop"></span>
          <span class="ring-loop"></span>
          <span class="ring-loop"></span>
        </div>

        <div class="logbook-header">
          <span class="logbook-title">TODAY'S LOG</span>
          <span class="logbook-count-badge" id="pomoCountBadge">🍅 × 0</span>
        </div>

        <div class="stamp-grid" id="stampGrid">
          <span class="empty-log-hint">完成一次專注即可蓋上番茄印章...</span>
        </div>

        <div class="logbook-footer">
          <span id="logDateText">2026-10-16</span>
          <button type="button" class="clear-log-btn" id="clearLogBtn">清空今日紀錄</button>
        </div>
      </div>

    </div>

    <!-- Layer 6: 全螢幕專注完成金黃光暈特效 -->
    <div class="completion-glow-overlay" id="completionGlow"></div>

    <!-- Layer 6: 時間自訂與模式切換彈窗 -->
    <div class="modal-backdrop" id="settingsModalBackdrop" role="dialog" aria-modal="true" aria-labelledby="settingsModalTitle">
      <div class="settings-drawer">
        <div class="settings-header">
          <span class="settings-title" id="settingsModalTitle">⏱ 計時器時間設定</span>
          <button type="button" class="close-modal-btn" id="closeSettingsBtn" aria-label="關閉設定">✕</button>
        </div>

        <span class="preset-section-label">快速模式切換</span>
        <div class="preset-btn-group">
          <button type="button" class="preset-chip active" id="preset50Btn" data-mode="50-10">
            標準沉浸<br /><small>50 分工作 / 10 分休息</small>
          </button>
          <button type="button" class="preset-chip" id="preset25Btn" data-mode="25-5">
            經典番茄<br /><small>25 分工作 / 5 分休息</small>
          </button>
        </div>

        <span class="preset-section-label">自訂時間（分鐘）</span>
        <div class="custom-inputs-row">
          <div class="input-field-box">
            <label for="workMinutesInput">專注時長 (1 ~ 120)</label>
            <input type="number" id="workMinutesInput" min="1" max="120" value="50" />
          </div>
          <div class="input-field-box">
            <label for="breakMinutesInput">休息時長 (1 ~ 60)</label>
            <input type="number" id="breakMinutesInput" min="1" max="60" value="10" />
          </div>
        </div>

        <div class="running-warning-note" id="settingsRunningWarn">
          ⚠️ 目前計時正在進行或暫停中，儲存新設定將會自動重置當前倒數進度。
        </div>

        <div class="settings-footer">
          <button type="button" class="btn-save-settings" id="saveSettingsBtn">儲存並套用設定</button>
        </div>
      </div>
    </div>

  </div>

  <script>
    (function () {
      "use strict";

      /* =========================================
         1. LocalStorage 鍵值規範與預設狀態
         ========================================= */
      const STORAGE_KEYS = {
        SETTINGS: "cafe_pomo_settings",
        RECORD: "cafe_pomo_record"
      };

      const DEFAULT_SETTINGS = {
        workMinutes: 50,
        breakMinutes: 10,
        currentMode: "50-10" // "50-10" | "25-5" | "custom"
      };

      let appSettings = { ...DEFAULT_SETTINGS };
      let appRecord = {
        lastDate: getLocalTodayString(),
        todayPomoCount: 0
      };

      // 計時器狀態機: "idle" | "running" | "paused"
      let timerStatus = "idle";
      // 當前階段: "work" | "break"
      let currentPhase = "work";
      let remainingSeconds = appSettings.workMinutes * 60;
      let targetEndTime = null;
      let timerIntervalId = null;

      // 防呆確認彈窗待執行的回呼動作
      let pendingConfirmAction = null;

      /* =========================================
         2. DOM 元素綁定
         ========================================= */
      const appViewport = document.getElementById("appViewport");
      const realTimeClockText = document.getElementById("realTimeClockText");
      const timerUnit = document.getElementById("timerUnit");
      const lcdModeLabel = document.getElementById("lcdModeLabel");
      const lcdPresetLabel = document.getElementById("lcdPresetLabel");
      const timerDigits = document.getElementById("timerDigits");
      const startPauseBtn = document.getElementById("startPauseBtn");
      const startPauseIcon = document.getElementById("startPauseIcon");
      const startPauseText = document.getElementById("startPauseText");
      const resetBtn = document.getElementById("resetBtn");
      const openSettingsBtn = document.getElementById("openSettingsBtn");
      const quickTogglePhaseBtn = document.getElementById("quickTogglePhaseBtn");

      const confirmPopover = document.getElementById("confirmPopover");
      const confirmPopoverMsg = document.getElementById("confirmPopoverMsg");
      const confirmCancelBtn = document.getElementById("confirmCancelBtn");
      const confirmYesBtn = document.getElementById("confirmYesBtn");

      const pomoCountBadge = document.getElementById("pomoCountBadge");
      const stampGrid = document.getElementById("stampGrid");
      const logDateText = document.getElementById("logDateText");
      const clearLogBtn = document.getElementById("clearLogBtn");

      const completionGlow = document.getElementById("completionGlow");
      const settingsModalBackdrop = document.getElementById("settingsModalBackdrop");
      const closeSettingsBtn = document.getElementById("closeSettingsBtn");
      const preset50Btn = document.getElementById("preset50Btn");
      const preset25Btn = document.getElementById("preset25Btn");
      const workMinutesInput = document.getElementById("workMinutesInput");
      const breakMinutesInput = document.getElementById("breakMinutesInput");
      const settingsRunningWarn = document.getElementById("settingsRunningWarn");
      const saveSettingsBtn = document.getElementById("saveSettingsBtn");

      /* =========================================
         3. Web Audio API 音效合成器（無外部依賴）
         ========================================= */
      let audioCtx = null;

      function ensureAudioUnlocked() {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return null;
        if (!audioCtx) {
          audioCtx = new AudioContextClass();
        }
        if (audioCtx.state === "suspended") {
          audioCtx.resume();
        }
        return audioCtx;
      }

      // 輕巧機械按鍵回饋音
      function playButtonClickTick() {
        const ctx = ensureAudioUnlocked();
        if (!ctx) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(190, now);
        osc.frequency.exponentialRampToValueAtTime(75, now + 0.035);

        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.035);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.04);
      }

      // 工作完成音效：澄澈水晶鐘琴三連音琶音 C5 (523.25Hz) -> E5 (659.25Hz) -> G5 (783.99Hz)
      function playWorkCompleteChime() {
        const ctx = ensureAudioUnlocked();
        if (!ctx) return;
        const notes = [523.25, 659.25, 783.99];
        const now = ctx.currentTime;

        notes.forEach((freq, idx) => {
          const startTime = now + idx * 0.22;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.type = "sine";
          osc.frequency.setValueAtTime(freq, startTime);

          gain.gain.setValueAtTime(0.0001, startTime);
          gain.gain.linearRampToValueAtTime(0.24, startTime + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0008, startTime + 1.5);

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(startTime);
          osc.stop(startTime + 1.55);
        });
      }

      // 休息結束音效：輕柔雙音提醒 A4 (440Hz) -> C5 (523.25Hz)
      function playBreakCompleteChime() {
        const ctx = ensureAudioUnlocked();
        if (!ctx) return;
        const notes = [440.0, 523.25];
        const now = ctx.currentTime;

        notes.forEach((freq, idx) => {
          const startTime = now + idx * 0.28;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.type = "sine";
          osc.frequency.setValueAtTime(freq, startTime);

          gain.gain.setValueAtTime(0.0001, startTime);
          gain.gain.linearRampToValueAtTime(0.18, startTime + 0.025);
          gain.gain.exponentialRampToValueAtTime(0.0008, startTime + 1.35);

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(startTime);
          osc.stop(startTime + 1.4);
        });
      }

      /* =========================================
         4. 日期與真實世界時鐘工具
         ========================================= */
      function pad2(num) {
        return String(num).padStart(2, "0");
      }

      function getLocalTodayString() {
        const now = new Date();
        const y = now.getFullYear();
        const m = pad2(now.getMonth() + 1);
        const d = pad2(now.getDate());
        return `${y}-${m}-${d}`;
      }

      function updateRealWorldClock() {
        const now = new Date();
        const days = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];
        const datePart = `${now.getFullYear()}-${pad2(now.getMonth() + 1)}-${pad2(now.getDate())}`;
        const dayPart = days[now.getDay()];
        const timePart = `${pad2(now.getHours())}:${pad2(now.getMinutes())}:${pad2(now.getSeconds())}`;
        realTimeClockText.textContent = `${datePart} · ${dayPart} · ${timePart}`;

        // 跨日自動歸零檢查
        if (datePart !== appRecord.lastDate) {
          appRecord.lastDate = datePart;
          appRecord.todayPomoCount = 0;
          saveRecordToStorage();
          renderLogbook(false);
        }
      }

      /* =========================================
         5. LocalStorage 讀取與寫入
         ========================================= */
      function clampInt(val, min, max, fallback) {
        const parsed = parseInt(val, 10);
        if (Number.isNaN(parsed)) return fallback;
        return Math.min(max, Math.max(min, parsed));
      }

      function loadStateFromStorage() {
        try {
          const rawSettings = localStorage.getItem(STORAGE_KEYS.SETTINGS);
          if (rawSettings) {
            const parsed = JSON.parse(rawSettings);
            const workMin = clampInt(parsed.workMinutes, 1, 120, 50);
            const breakMin = clampInt(parsed.breakMinutes, 1, 60, 10);
            const mode = ["50-10", "25-5", "custom"].includes(parsed.currentMode)
              ? parsed.currentMode
              : "custom";
            appSettings = { workMinutes: workMin, breakMinutes: breakMin, currentMode: mode };
          }
        } catch (err) {
          appSettings = { ...DEFAULT_SETTINGS };
        }

        const todayStr = getLocalTodayString();
        try {
          const rawRecord = localStorage.getItem(STORAGE_KEYS.RECORD);
          if (rawRecord) {
            const parsedRec = JSON.parse(rawRecord);
            if (parsedRec && parsedRec.lastDate === todayStr) {
              appRecord = {
                lastDate: todayStr,
                todayPomoCount: Math.max(0, parseInt(parsedRec.todayPomoCount, 10) || 0)
              };
            } else {
              // 跨日自動歸零
              appRecord = { lastDate: todayStr, todayPomoCount: 0 };
              saveRecordToStorage();
            }
          } else {
            saveRecordToStorage();
          }
        } catch (err) {
          appRecord = { lastDate: todayStr, todayPomoCount: 0 };
        }
      }

      function saveSettingsToStorage() {
        try {
          localStorage.setItem(STORAGE_KEYS.SETTINGS, JSON.stringify(appSettings));
        } catch (err) {
          // 忽略隱私模式配額錯誤
        }
      }

      function saveRecordToStorage() {
        try {
          localStorage.setItem(STORAGE_KEYS.RECORD, JSON.stringify(appRecord));
        } catch (err) {
          // 忽略隱私模式配額錯誤
        }
      }

      /* =========================================
         6. 畫面渲染與手帳蓋印更新
         ========================================= */
      function formatMMSS(totalSec) {
        const mins = Math.floor(totalSec / 60);
        const secs = totalSec % 60;
        return `${pad2(mins)}:${pad2(secs)}`;
      }

      function updateTimerUI() {
        const formatted = formatMMSS(remainingSeconds);
        timerDigits.textContent = formatted;

        // 更新模式樣式與面板文字
        if (currentPhase === "work") {
          timerUnit.classList.add("mode-work");
          timerUnit.classList.remove("mode-break");
          lcdModeLabel.textContent = "MODE: FOCUS WORK";
        } else {
          timerUnit.classList.add("mode-break");
          timerUnit.classList.remove("mode-work");
          lcdModeLabel.textContent = "MODE: COZY BREAK";
        }

        lcdPresetLabel.textContent = `${appSettings.workMinutes}M / ${appSettings.breakMinutes}M`;

        // 狀態樣式與按鈕文字
        timerUnit.classList.toggle("is-paused", timerStatus === "paused");
        appViewport.classList.toggle("is-running", timerStatus === "running");

        if (timerStatus === "running") {
          startPauseBtn.classList.add("running-state");
          startPauseIcon.textContent = "⏸";
          startPauseText.textContent = "暫停";
        } else if (timerStatus === "paused") {
          startPauseBtn.classList.remove("running-state");
          startPauseIcon.textContent = "▶";
          startPauseText.textContent = "繼續";
        } else {
          startPauseBtn.classList.remove("running-state");
          startPauseIcon.textContent = "▶";
          startPauseText.textContent = currentPhase === "work" ? "開始專注" : "開始休息";
        }

        // 瀏覽器分頁標題連動
        if (timerStatus === "running" || timerStatus === "paused") {
          const tag = currentPhase === "work" ? "☕ 專注中" : "🌿 休息中";
          document.title = `(${formatted}) ${tag} | 咖啡廳番茄鐘`;
        } else {
          document.title = "沉浸式咖啡廳番茄鐘 | Lo-Fi Cafe Pomodoro";
        }
      }

      function renderLogbook(animateLatest) {
        logDateText.textContent = appRecord.lastDate;
        pomoCountBadge.textContent = `🍅 × ${appRecord.todayPomoCount}`;
        stampGrid.innerHTML = "";

        if (appRecord.todayPomoCount <= 0) {
          const hint = document.createElement("span");
          hint.className = "empty-log-hint";
          hint.textContent = "完成一次專注即可蓋上番茄印章...";
          stampGrid.appendChild(hint);
          return;
        }

        const maxVisibleStamps = 12;
        const displayCount = Math.min(appRecord.todayPomoCount, maxVisibleStamps);

        for (let i = 0; i < displayCount; i++) {
          const stamp = document.createElement("div");
          stamp.className = "tomato-stamp";
          if (animateLatest && i === displayCount - 1 && appRecord.todayPomoCount <= maxVisibleStamps) {
            stamp.classList.add("stamp-new");
          }
          stamp.textContent = "🍅";
          stamp.title = `第 ${i + 1} 顆專注番茄`;
          stampGrid.appendChild(stamp);
        }

        if (appRecord.todayPomoCount > maxVisibleStamps) {
          const overflowPill = document.createElement("span");
          overflowPill.className = "stamp-overflow-pill";
          if (animateLatest) {
            overflowPill.classList.add("tomato-stamp", "stamp-new");
          }
          overflowPill.textContent = `+${appRecord.todayPomoCount - maxVisibleStamps} 🍅`;
          stampGrid.appendChild(overflowPill);
        }
      }

      function triggerCompletionVisualGlow() {
        completionGlow.classList.remove("active-glow");
        void completionGlow.offsetWidth; // 強制 Reflow 重啟動畫
        completionGlow.classList.add("active-glow");
      }

      /* =========================================
         7. 高精度時間戳計時核心邏輯
         ========================================= */
      function getPhaseDurationSeconds(phase) {
        return (phase === "work" ? appSettings.workMinutes : appSettings.breakMinutes) * 60;
      }

      function startTimer() {
        ensureAudioUnlocked();
        hideConfirmPopover();

        targetEndTime = Date.now() + remainingSeconds * 1000;
        timerStatus = "running";

        if (timerIntervalId) clearInterval(timerIntervalId);
        timerIntervalId = setInterval(tickTimer, 250);
        updateTimerUI();
      }

      function pauseTimer() {
        if (timerStatus !== "running") return;
        if (timerIntervalId) {
          clearInterval(timerIntervalId);
          timerIntervalId = null;
        }
        remainingSeconds = Math.max(0, Math.ceil((targetEndTime - Date.now()) / 1000));
        targetEndTime = null;
        timerStatus = "paused";
        updateTimerUI();
      }

      function resetTimerToCurrentPhase() {
        if (timerIntervalId) {
          clearInterval(timerIntervalId);
          timerIntervalId = null;
        }
        targetEndTime = null;
        timerStatus = "idle";
        remainingSeconds = getPhaseDurationSeconds(currentPhase);
        updateTimerUI();
      }

      function switchPhase(newPhase) {
        if (timerIntervalId) {
          clearInterval(timerIntervalId);
          timerIntervalId = null;
        }
        targetEndTime = null;
        timerStatus = "idle";
        currentPhase = newPhase;
        remainingSeconds = getPhaseDurationSeconds(currentPhase);
        updateTimerUI();
      }

      function tickTimer() {
        if (timerStatus !== "running" || !targetEndTime) return;
        const currentRemaining = Math.max(0, Math.ceil((targetEndTime - Date.now()) / 1000));
        if (currentRemaining !== remainingSeconds) {
          remainingSeconds = currentRemaining;
          updateTimerUI();
        }
        if (currentRemaining <= 0) {
          handleTimerCompleted();
        }
      }

      function handleTimerCompleted() {
        if (timerIntervalId) {
          clearInterval(timerIntervalId);
          timerIntervalId = null;
        }
        targetEndTime = null;
        timerStatus = "idle";

        // 視覺金黃光暈特效
        triggerCompletionVisualGlow();

        if (currentPhase === "work") {
          playWorkCompleteChime();
          const todayStr = getLocalTodayString();
          if (appRecord.lastDate !== todayStr) {
            appRecord.lastDate = todayStr;
            appRecord.todayPomoCount = 0;
          }
          appRecord.todayPomoCount += 1;
          saveRecordToStorage();
          renderLogbook(true);

          // 自動切換至休息模式
          currentPhase = "break";
        } else {
          playBreakCompleteChime();
          // 自動切換至工作模式
          currentPhase = "work";
        }

        remainingSeconds = getPhaseDurationSeconds(currentPhase);
        updateTimerUI();
      }

      /* =========================================
         8. 防呆確認氣泡與設定抽屜互動
         ========================================= */
      function showConfirmPopover(message, yesButtonLabel, onConfirm) {
        confirmPopoverMsg.textContent = message;
        confirmYesBtn.textContent = yesButtonLabel;
        pendingConfirmAction = onConfirm;
        confirmPopover.classList.add("show");
      }

      function hideConfirmPopover() {
        confirmPopover.classList.remove("show");
        pendingConfirmAction = null;
      }

      function syncSettingsModalInputs() {
        workMinutesInput.value = appSettings.workMinutes;
        breakMinutesInput.value = appSettings.breakMinutes;
        preset50Btn.classList.toggle("active", appSettings.currentMode === "50-10");
        preset25Btn.classList.toggle("active", appSettings.currentMode === "25-5");
        settingsRunningWarn.classList.toggle("visible", timerStatus !== "idle");
      }

      function openSettingsModal() {
        playButtonClickTick();
        hideConfirmPopover();
        syncSettingsModalInputs();
        settingsModalBackdrop.classList.add("open");
      }

      function closeSettingsModal() {
        settingsModalBackdrop.classList.remove("open");
      }

      /* =========================================
         9. 事件監聽綁定
         ========================================= */
      startPauseBtn.addEventListener("click", () => {
        playButtonClickTick();
        if (timerStatus === "running") {
          pauseTimer();
        } else {
          startTimer();
        }
      });

      resetBtn.addEventListener("click", () => {
        playButtonClickTick();
        const fullSeconds = getPhaseDurationSeconds(currentPhase);
        if (timerStatus !== "idle" || remainingSeconds !== fullSeconds) {
          showConfirmPopover(
            "計時正在進行中，確定要重置並放棄目前的倒數進度嗎？",
            "確定重置",
            () => {
              resetTimerToCurrentPhase();
            }
          );
        } else {
          resetTimerToCurrentPhase();
        }
      });

      quickTogglePhaseBtn.addEventListener("click", () => {
        playButtonClickTick();
        const nextPhase = currentPhase === "work" ? "break" : "work";
        const nextName = nextPhase === "work" ? "專注工作" : "休息";
        if (timerStatus !== "idle") {
          showConfirmPopover(
            `目前計時尚未結束，確定要切換至「${nextName}模式」嗎？`,
            "確定切換",
            () => {
              switchPhase(nextPhase);
            }
          );
        } else {
          switchPhase(nextPhase);
        }
      });

      confirmCancelBtn.addEventListener("click", () => {
        playButtonClickTick();
        hideConfirmPopover();
      });

      confirmYesBtn.addEventListener("click", () => {
        playButtonClickTick();
        if (typeof pendingConfirmAction === "function") {
          pendingConfirmAction();
        }
        hideConfirmPopover();
      });

      clearLogBtn.addEventListener("click", () => {
        playButtonClickTick();
        if (appRecord.todayPomoCount === 0) return;
        showConfirmPopover(
          "確定要清空手帳本上今日累積的所有番茄打卡紀錄嗎？",
          "確定清空",
          () => {
            appRecord.todayPomoCount = 0;
            appRecord.lastDate = getLocalTodayString();
            saveRecordToStorage();
            renderLogbook(false);
          }
        );
      });

      // 設定面板互動
      openSettingsBtn.addEventListener("click", openSettingsModal);
      closeSettingsBtn.addEventListener("click", () => {
        playButtonClickTick();
        closeSettingsModal();
      });

      settingsModalBackdrop.addEventListener("click", (e) => {
        if (e.target === settingsModalBackdrop) {
          closeSettingsModal();
        }
      });

      preset50Btn.addEventListener("click", () => {
        playButtonClickTick();
        workMinutesInput.value = 50;
        breakMinutesInput.value = 10;
        preset50Btn.classList.add("active");
        preset25Btn.classList.remove("active");
      });

      preset25Btn.addEventListener("click", () => {
        playButtonClickTick();
        workMinutesInput.value = 25;
        breakMinutesInput.value = 5;
        preset25Btn.classList.add("active");
        preset50Btn.classList.remove("active");
      });

      function handleCustomInputChanged() {
        const w = parseInt(workMinutesInput.value, 10);
        const b = parseInt(breakMinutesInput.value, 10);
        preset50Btn.classList.toggle("active", w === 50 && b === 10);
        preset25Btn.classList.toggle("active", w === 25 && b === 5);
      }

      workMinutesInput.addEventListener("input", handleCustomInputChanged);
      breakMinutesInput.addEventListener("input", handleCustomInputChanged);

      saveSettingsBtn.addEventListener("click", () => {
        playButtonClickTick();
        const validWork = clampInt(workMinutesInput.value, 1, 120, 50);
        const validBreak = clampInt(breakMinutesInput.value, 1, 60, 10);

        let mode = "custom";
        if (validWork === 50 && validBreak === 10) mode = "50-10";
        else if (validWork === 25 && validBreak === 5) mode = "25-5";

        appSettings = {
          workMinutes: validWork,
          breakMinutes: validBreak,
          currentMode: mode
        };

        saveSettingsToStorage();
        resetTimerToCurrentPhase();
        closeSettingsModal();
      });

      // 當分頁切回前景時，立即校正一次倒數秒數
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden && timerStatus === "running") {
          tickTimer();
        }
      });

      /* =========================================
         10. 啟動初始化
         ========================================= */
      loadStateFromStorage();
      remainingSeconds = getPhaseDurationSeconds(currentPhase);
      updateRealWorldClock();
      setInterval(updateRealWorldClock, 1000);
      renderLogbook(false);
      updateTimerUI();
    })();
  </script>
</body>
</html>
